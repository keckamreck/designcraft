<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, interactive-widget=resizes-content">
  <title>DesignCraft</title>
  <!-- Installable web app (Chrome, Edge, ChromeOS, Android): packaging/web/README.md. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#262626">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DesignCraft">
  <link rel="apple-touch-icon" href="icons/designcraft-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/designcraft-192.png">
  <link data-trunk rel="copy-file" href="manifest.webmanifest" />
  <link data-trunk rel="copy-file" href="../../assets/app-icon/web/designcraft-192.png" data-target-path="icons" />
  <link data-trunk rel="copy-file" href="../../assets/app-icon/web/designcraft-512.png" data-target-path="icons" />
  <link data-trunk rel="copy-file" href="../../assets/app-icon/web/designcraft-maskable-512.png" data-target-path="icons" />
  <link data-trunk rel="rust" data-bin="designcraft-web" data-wasm-opt="z" data-weak-refs />
  <style>
    /* No pull-to-refresh, tap flash or long-press callout on touch screens. */
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626;
      overscroll-behavior: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
    #designcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
    #designcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="designcraft_canvas"></canvas>
  <div id="designcraft_loading">Loading DesignCraft&hellip;</div>
</body>
</html>
